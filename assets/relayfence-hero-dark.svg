<rect x="835" y="130" width="149" height="156" rx="18" fill="#121F37" stroke="#36D9E3" stroke-width="1.5"/><text x="909.5" y="221" fill="#F1F7FF" font-size="13.5" font-weight="750" text-anchor="middle" letter-spacing="1.2">POLICY GATE</text><text x="909.5" y="241" fill="#A7C0D6" font-size="12" font-weight="450" text-anchor="middle">revision checked</text>
<rect x="1030" y="149" width="135" height="137" rx="18" fill="#121F37" stroke="#354966" stroke-width="1.5"/><text x="1097.5" y="240" fill="#F1F7FF" font-size="13.5" font-weight="750" text-anchor="middle" letter-spacing="1.2">UPSTREAM</text><text x="1097.5" y="260" fill="#A7C0D6" font-size="12" font-weight="450" text-anchor="middle">approved IP</text>
