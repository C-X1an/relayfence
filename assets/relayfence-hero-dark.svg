<rect x="56" y="57" width="61" height="61" rx="17" fill="#1A3752" stroke="#36D9E3" stroke-width="1.5"/>
<path d="M75 90V76H98V90L86.5 102.5Z" fill="none" stroke="#36D9E3" stroke-width="3.3" stroke-linejoin="round"/>
<path d="M79 90H94" stroke="#36D9E3" stroke-width="3" stroke-linecap="round"/>
<circle cx="75" cy="90" r="3" fill="#F1F7FF"/><circle cx="98" cy="90" r="3" fill="#F1F7FF"/>
<text x="133" y="81" fill="#36D9E3" font-size="13.5" font-weight="800" letter-spacing="2.4">NETWORK POLICY / SYSTEMS ENGINEERING</text>
<text x="133" y="108" fill="#ABBDD7" font-size="13" font-weight="500" letter-spacing="1.2">OPEN SOURCE  ·  EXPERIMENTAL</text>
<text x="56" y="213" fill="#F1F7FF" font-size="82" font-weight="800" letter-spacing="-3.4">RelayFence</text>
<text x="58" y="262" fill="#F1F7FF" font-size="25.5" font-weight="600" letter-spacing="-.25">Bound the route. Preserve the evidence.</text>
<text x="58" y="291" fill="#ABBDD7" font-size="16.7">Identity-bound egress for autonomous workloads.</text>
<rect x="58" y="326" width="124" height="34" rx="17" fill="#152740" stroke="#34516C"/><text x="120" y="348" fill="#D2E6F9" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.05">mTLS IDENTITY</text><rect x="193" y="326" width="139" height="34" rx="17" fill="#152740" stroke="#34516C"/><text x="262.5" y="348" fill="#D2E6F9" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.05">LIVE REVOCATION</text><rect x="343" y="326" width="155" height="34" rx="17" fill="#152740" stroke="#34516C"/><text x="420.5" y="348" fill="#D2E6F9" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.05">BOUNDED RELAY</text>
