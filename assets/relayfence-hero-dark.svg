<circle cx="1097.5" cy="193" r="22" fill="#1A3752" stroke="#3F6388"/><path d="M1086 192l9 9 15-18" fill="none" stroke="#36D9E3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
