<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="1200" height="400" viewBox="0 0 1200 400">
<title id="title">RelayFence — identity-bound network egress for autonomous workloads</title>
<desc id="desc">A technical cover image showing an authenticated workload, policy gateway and approved upstream, with a disallowed route stopped.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070F20"/><stop offset="1" stop-color="#111D39"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#117D92" stop-opacity=".18"/><stop offset="1" stop-color="#117D92" stop-opacity="0"/></radialGradient>
 <pattern id="grid" width="27" height="27" patternUnits="userSpaceOnUse"><path d="M27 0H0V27" fill="none" stroke="#799BC4" stroke-opacity=".12" stroke-width="1"/></pattern>
 <linearGradient id="accent"><stop stop-color="#27B8EB"/><stop offset=".55" stop-color="#38E0D0"/><stop offset="1" stop-color="#8BE8AE"/></linearGradient>
</defs>
<rect width="1200" height="400" rx="22" fill="url(#bg)"/>
<rect x="628" y="24" width="550" height="350" rx="17" fill="url(#grid)"/>
<circle cx="934" cy="185" r="270" fill="url(#aura)"/>
<path d="M613 52V349" stroke="#3F6388" stroke-opacity=".4" stroke-width="1"/>
<path d="M49 376H1150" stroke="#3F6388" stroke-opacity=".38" stroke-width="1"/>
<path d="M49 376H320" stroke="url(#accent)" stroke-width="3"/>
